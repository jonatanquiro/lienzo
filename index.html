<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Lienzo</title>
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lienzo">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0e1014;--panel:#161920;--panel2:#1d212a;--well:#0a0c10;--line:#272c36;--line2:#363d4a;--tx:#eef0f4;--mut:#8d95a5;--ac:#ffb020;--ac2:#ffc657;--actx:#1a1300;--bad:#ff7366;--r:12px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:dark;height:100%}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.ic{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button,.btn{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .12s,border-color .12s}
button:hover,.btn:hover{background:#272c38;border-color:#444c5b}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.primary{background:var(--ac);color:var(--actx);border-color:var(--ac);font-weight:700}
button.primary:hover{background:var(--ac2);border-color:var(--ac2)}
button.sm{padding:5px 8px;min-width:32px;border-radius:8px}
button.on{border-color:var(--ac);color:var(--ac);background:#2c2410}
button.del{color:var(--bad)}
button:disabled{opacity:.38;cursor:default}
button.wide{width:100%}
input[type=number],input[type=text],input[type=search],input[type=password],select,textarea{font:inherit;color:var(--tx);background:var(--well);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;min-width:0}
input[type=range]{accent-color:var(--ac);min-width:0}
input[type=checkbox]{accent-color:var(--ac);width:16px;height:16px}
input[type=color]{width:38px;height:30px;padding:2px;background:var(--well);border:1px solid var(--line2);border-radius:8px;flex:none}
textarea{width:100%;resize:vertical;min-height:60px}
a{color:var(--ac)}

header{flex:none;padding:max(8px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:9px;margin-right:4px}
.brand svg{width:28px;height:28px;border-radius:8px}
.brand b{font-size:17px;letter-spacing:-.2px}
#name{width:150px;background:transparent;border-color:transparent}
#name:hover{border-color:var(--line2)}
.grow{flex:1}
.grp{display:flex;gap:4px;align-items:center}
#zl{min-width:54px}

#app{flex:1;min-height:0;display:grid;grid-template-columns:70px 310px minmax(0,1fr) 290px}
body:not(.left-open) #app{grid-template-columns:70px 0 minmax(0,1fr) 290px}
body:not(.left-open) #left{display:none}
#rail{grid-column:1}#left{grid-column:2}#work{grid-column:3}#insp{grid-column:4}
#rail{display:flex;flex-direction:column;gap:2px;padding:8px 5px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;scrollbar-width:none}
#rail button{flex-direction:column;gap:3px;font-size:10.5px;padding:8px 2px;border:0;background:none;color:var(--mut);flex:none}
#rail button .ic{width:20px;height:20px}
#rail button:hover{color:var(--tx);background:var(--panel2)}
#rail button.on{background:var(--panel2);color:var(--ac)}
#rail .mob{display:none}
#left,#insp{background:var(--panel);overflow:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#left{border-right:1px solid var(--line)}
#insp{border-left:1px solid var(--line)}
h2{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--mut)}
h3{margin:16px 0 8px;font-size:12px;font-weight:700;color:var(--mut)}
.hint{font-size:12.5px;color:var(--mut);margin:8px 0}
#work{display:flex;flex-direction:column;min-width:0;min-height:0}
#scroller{flex:1;min-height:0;overflow:auto;display:flex;padding:28px;background:var(--well)}
#stage{position:relative;margin:auto;flex:none;box-shadow:0 10px 40px rgba(0,0,0,.55);touch-action:none;background:repeating-conic-gradient(#d9d9d9 0 25%,#fff 0 50%) 0 0/20px 20px}
body.draw #stage{cursor:crosshair}
#cv{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;pointer-events:none}
.sb{position:absolute;outline:1.5px solid var(--ac)}
.sb.multi{outline-style:dashed}
.sb.lock{outline-color:#8d95a5}
.hd{position:absolute;width:13px;height:13px;margin:-6.5px;background:#fff;border:1.5px solid var(--ac);border-radius:50%;pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.hd.rot{background:var(--ac);cursor:grab}
.hd.rot::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:16px;background:var(--ac);margin-left:-.75px}
@media (pointer:coarse){.hd{width:20px;height:20px;margin:-10px}}
.gd{position:absolute;background:#ff3d9a}
.sb.grp{outline-style:solid}
.ftb{position:absolute;transform:translateX(-50%);display:flex;gap:1px;padding:3px;background:var(--panel);border:1px solid var(--line2);border-radius:11px;box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:auto;white-space:nowrap}
.ftb button{padding:6px 7px;border:0;background:none;border-radius:8px}
.ftb button:hover{background:var(--panel2)}
.ftb button[data-act=del]{color:var(--bad)}
.ftb svg{pointer-events:none}
.sw canvas{width:100%;height:100%;display:block;border-radius:7px}
#marq{position:absolute;border:1px solid var(--ac);background:rgba(255,176,32,.15)}
.ted{position:absolute;margin:0;padding:0;border:0;outline:1.5px dashed var(--ac);background:transparent;resize:none;overflow:hidden;min-height:0;border-radius:0;white-space:pre-wrap;caret-color:var(--ac)}
#pages{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px max(8px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}
#pages .pt{padding:0;border:2px solid var(--line2);border-radius:8px;overflow:hidden;flex:none;position:relative;background:#fff}
#pages .pt.on{border-color:var(--ac)}
#pages .pt canvas{display:block;height:50px;width:auto}
#pages .pt span{position:absolute;left:3px;bottom:2px;font-size:10px;background:rgba(0,0,0,.6);color:#fff;padding:0 4px;border-radius:4px}

details.sec{border-top:1px solid var(--line);padding:10px 0}
details.sec summary{cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
details.sec[open] summary{margin-bottom:10px}
.fr{display:grid;grid-template-columns:84px 1fr 44px;gap:8px;align-items:center;margin:7px 0;font-size:13px;color:var(--mut)}
.fr output{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:7px 0;font-size:13px;color:var(--mut)}
.frow>span:first-child{min-width:76px}
.frow select,.frow input[type=text]{flex:1}
.frow input[type=number]{width:74px}
.frow input[type=range]{flex:1}
.mini{display:inline-flex;gap:5px;align-items:center;font-size:12.5px}
.acts{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.grid{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.grid.g6{grid-template-columns:repeat(6,1fr)}
.th{padding:0;overflow:hidden;border-radius:9px;background:var(--well);aspect-ratio:4/3;position:relative}
.th img,.th canvas{width:100%;height:100%;object-fit:cover;display:block}
.th.fit img,.th.fit canvas{object-fit:contain}
.th.sq{aspect-ratio:1}
.th.icn{aspect-ratio:1;padding:9px;background:var(--panel2)}
.th.icn img{object-fit:contain}
.th small{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;padding:2px 5px;background:rgba(0,0,0,.6);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.sw{aspect-ratio:1;padding:0;border-radius:8px;min-width:0}
.emo{padding:2px;font-size:24px;line-height:1.25;background:none;border-color:transparent}
.flt{padding:0;overflow:hidden;border-radius:8px;aspect-ratio:1;position:relative;background-size:cover;background-position:center}
.flt small{position:absolute;left:0;right:0;bottom:0;font-size:10px;background:rgba(0,0,0,.65);color:#fff;padding:1px 2px}
.search{display:flex;gap:6px;margin:8px 0}
.search input{flex:1}
.lay{display:flex;align-items:center;gap:4px;padding:5px 6px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px;background:var(--panel2);cursor:pointer}
.lay.on{border-color:var(--ac)}
.lay span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.lay button{padding:3px 5px;border:0;background:none;min-width:0}
.lay button .ic{width:15px;height:15px}
.tp{display:block;width:100%;padding:6px;margin-bottom:6px;background:var(--panel2)}
.tp canvas{display:block;width:100%;height:auto}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.chips button{padding:3px 9px;font-size:12px;border-radius:999px}

.modal{position:fixed;inset:0;background:rgba(6,7,9,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:40;display:flex;align-items:center;justify-content:center;padding:12px}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:min(560px,100%);max-height:100%;overflow:auto;padding:16px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.mbox.big{width:auto;max-width:100%}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mhead b{flex:1;font-size:16px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.cwrap{position:relative;overflow:hidden;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;background:#000}
.cwrap img{width:100%;height:100%;display:block;pointer-events:none}
.cbox{position:absolute;outline:2px solid var(--ac);box-shadow:0 0 0 9999px rgba(0,0,0,.62);cursor:move}
.cbox i{position:absolute;width:18px;height:18px;margin:-9px;background:#fff;border:2px solid var(--ac);border-radius:50%}
.cbox i[data-h=nw]{left:0;top:0}.cbox i[data-h=ne]{left:100%;top:0}.cbox i[data-h=sw]{left:0;top:100%}.cbox i[data-h=se]{left:100%;top:100%}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;border:1px solid var(--line2);padding:9px 16px;border-radius:999px;z-index:60;font-size:13.5px;max-width:92vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
body.drag::after{content:"Soltá las imágenes acá";position:fixed;inset:10px;border:3px dashed var(--ac);border-radius:16px;background:rgba(14,16,20,.88);display:grid;place-items:center;font-size:22px;font-weight:600;z-index:50}

@media (max-width:900px){
  .lbl,#name,.brand b,#zOut,#zIn,#bSize span{display:none}
  header{gap:4px;padding-left:8px;padding-right:8px}
  header .grp{gap:3px}
  header button,header button.sm{padding:7px 8px;min-width:0}
  .brand{margin-right:0}
  #app{display:flex;flex-direction:column}
  #work{flex:1;order:1}
  #scroller{padding:14px}
  #rail{order:3;flex:none;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:4px 4px max(4px,env(safe-area-inset-bottom));overflow-x:auto}
  #rail button{min-width:62px}
  #rail .mob{display:inline-flex}
  #left,#insp{display:none;order:2;flex:none;max-height:42vh;border:0;border-top:1px solid var(--line2);border-radius:16px 16px 0 0}
  body.has-sel #rail [data-t=editar]{color:var(--ac)}
  body.left-open #left{display:block}
  body.insp-open #insp{display:block}
  #pages{padding:5px 8px}
  #pages .pt canvas{height:34px}
}
</style>
</head>
<body class="left-open">
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32"><rect width="32" height="32" fill="#1d212a"/><rect x="6" y="8" width="15" height="15" rx="3" fill="#ffb020"/><circle cx="20.5" cy="19.5" r="7" fill="#fff" fill-opacity=".92"/></svg>
    <b>Lienzo</b>
  </div>
  <input id="name" type="text" value="Mi diseño" title="Nombre del diseño" spellcheck="false">
  <div class="grp">
    <button id="bNew" class="sm" title="Diseño nuevo"></button>
    <button id="bOpen" class="sm" title="Abrir proyecto (.lienzo)"></button>
    <button id="bSave" class="sm" title="Guardar proyecto (Ctrl+S)"></button>
  </div>
  <div class="grp">
    <button id="bUndo" class="sm" title="Deshacer (Ctrl+Z)"></button>
    <button id="bRedo" class="sm" title="Rehacer (Ctrl+Y)"></button>
  </div>
  <button id="bSize" title="Tamaño del lienzo"></button>
  <span class="grow"></span>
  <div class="grp">
    <button id="zOut" class="sm" title="Alejar">−</button>
    <button id="zl" class="sm" title="Ajustar a la pantalla">100%</button>
    <button id="zIn" class="sm" title="Acercar">+</button>
  </div>
  <button id="bInst" title="Instalar Lienzo como aplicación" hidden></button>
  <button id="bExp" class="primary"></button>
</header>
<div id="app">
  <nav id="rail"></nav>
  <aside id="left"></aside>
  <section id="work">
    <div id="scroller"><div id="stage"><canvas id="cv"></canvas><div id="ov"></div></div></div>
    <div id="pages"></div>
  </section>
  <aside id="insp"></aside>
</div>
<div id="toast"></div>
<input type="file" id="fImg" accept="image/*" multiple hidden>
<input type="file" id="fRepl" accept="image/*" hidden>
<input type="file" id="fProj" accept=".lienzo,.json,application/json" hidden>

<script>
'use strict';
/* ───────── utilidades ───────── */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const RAD=Math.PI/180,clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=x=>JSON.parse(JSON.stringify(x));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const enc=encodeURIComponent;
function el(tag,props={},...kids){const e=document.createElement(tag);for(const k in props){const v=props[k];if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k in e)e[k]=v;else e.setAttribute(k,v)}e.append(...kids.flat().filter(x=>x!=null&&x!==false));return e}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
const IC={undo:'M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3',redo:'m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3',download:'M12 3v12m-5-5 5 5 5-5M4 21h16',upload:'M12 15V3m-5 5 5-5 5 5M4 21h16',image:'M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6M15.5 9.5h.01',text:'M5 6V4h14v2M12 4v16M9 20h6',shapes:'M4 4h7v7H4zM17 21a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM14 10l3.5-6 3.5 6zM4 14h7v7H4z',layout:'M3 3h18v18H3zM3 9h18M9 9v12',brush:'M18 3l3 3-9.5 9.5-3-3zM7 14c-2 0-3 1.500-3 3.500 0 1.500-1 2.500-2 2.500 4 1 8 0 8-3',layers:'m12 3 9 5-9 5-9-5zM3 13l9 5 9-5M3 17l9 5 9-5',drop:'M12 3s6 6.500 6 11a6 6 0 0 1-12 0c0-4.500 6-11 6-11z',search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5',folder:'M3 6h6l2 2h10v11H3z',save:'M5 3h11l4 4v14H5zM8 3v6h7V3M8 21v-7h8v7',file:'M6 3h8l5 5v13H6zM14 3v5h5M12 12v6M9 15h6',trash:'M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14',copy:'M9 9h11v11H9zM5 15H4V4h11v1',lock:'M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3',unlock:'M6 11h12v9H6zM8 11V8a4 4 0 0 1 7.500-2',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',eyeoff:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM3 3l18 18',up:'m6 15 6-6 6 6',down:'m6 9 6 6 6-6',top:'m6 17 6-6 6 6M6 7h12',bottom:'m6 7 6 6 6-6M6 17h12',plus:'M12 5v14M5 12h14',x:'M6 6l12 12M18 6 6 18',sliders:'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M16 4v4M10 10v4M18 16v4',crop:'M6 2v16h16M2 6h16v16',fliph:'M12 3v18M8 7l-5 5 5 5zM16 7l5 5-5 5z',flipv:'M3 12h18M7 8l5-5 5 5zM7 16l5 5 5-5z',al:'M4 3v18M8 7h10v4H8zM8 14h6v4H8z',ac:'M12 3v18M6 7h12v4H6zM8 14h8v4H8z',ar:'M20 3v18M6 7h10v4H6zM10 14h6v4h-6z',at:'M3 4h18M7 8h4v10H7zM14 8h4v6h-4z',am:'M3 12h18M7 6h4v12H7zM14 8h4v8h-4z',ab:'M3 20h18M7 6h4v10H7zM14 10h4v6h-4z',photo:'M4 7h3l2-3h6l2 3h3v13H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',left:'m15 6-6 6 6 6',right:'m9 6 6 6-6 6',share:'M12 15V3m-4 4 4-4 4 4M5 12v9h14v-9'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const ib=(icon,title,fn,cls='sm')=>el('button',{className:cls,title,innerHTML:ic(icon),onclick:fn});
let toastT;function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms)}
function hexA(h,a){h=(h||'#000000').replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
const blobToURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=src});
function dl(blob,name){const a=el('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const isMob=()=>matchMedia('(max-width:900px)').matches;

/* ───────── estado ───────── */
const newDoc=(w,h)=>({w,h,pages:[{bg:'#ffffff',objs:[]}],uploads:[]});
let doc=newDoc(1080,1080),cur=0,sel=[],zoom=1,tool='select',editing=null,clip=null,tab='plantillas',guides=[],drag=null;
const assets={};
const pg=()=>doc.pages[cur],objs=()=>pg().objs,byId=id=>objs().find(o=>o.id===id),selObjs=()=>sel.map(byId).filter(Boolean);
const cv=$('#cv'),ctx=cv.getContext('2d'),ov=$('#ov'),stage=$('#stage'),scroller=$('#scroller');

function addAsset(src,id=uid()){return loadImg(src).then(img=>{assets[id]={src,img};return id})}
async function fileToSrc(blob){
  let src=await blobToURL(blob);
  if(blob.type==='image/svg+xml')return src;
  const img=await loadImg(src),m=Math.max(img.naturalWidth,img.naturalHeight);
  if(m>3200){const s=3200/m,c=mkCanvas(img.naturalWidth*s,img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);src=c.toDataURL(blob.type==='image/jpeg'?'image/jpeg':'image/png',.92)}
  return src;
}
async function addFiles(files){
  let n=0;
  for(const f of files){
    if(/\.lienzo$|json$/i.test(f.name||'')){openProject(f);return}
    if(!f.type.startsWith('image/'))continue;
    try{const id=await addAsset(await fileToSrc(f));doc.uploads.unshift(id);addImageObj(id);n++}catch(e){toast('No se pudo abrir "'+(f.name||'imagen')+'". Probá con JPG o PNG.')}
  }
  if(n&&tab==='subidas')openTab('subidas',true);

    const U=upLib.U??=(await import('https://cdn.jsdelivr.net/npm/upscaler@1.0.0/+esm')).default;
    const up=upLib[sc]??=new U({model:(await import(`https://cdn.jsdelivr.net/npm/@upscalerjs/esrgan-medium@1.0.0/${sc}x/+esm`)).default});
    const out=await up.upscale(a.img,{output:'base64',patchSize:64,padding:6,progress:p=>toast(`Mejorando la foto (${sc}×)… ${Math.round(p*100)}%`,120000)});

    o.asset=await addAsset(c.toDataURL(/png|webp|svg/.test(a.src.slice(5,20))?'image/png':'image/jpeg',.95));commit();buildInsp();
    toast(`Listo: la foto ahora tiene ${iw*sc} × ${ih*sc} px`,4000);

let nudgeT;
addEventListener('keydown',e=>{
  if(e.target.matches('input:not([type=range]):not([type=checkbox]):not([type=color]),textarea,select'))return;
  const m=$('.modal');if(m){if(e.key==='Escape')m.remove();return}
  const c=e.ctrlKey||e.metaKey,k=e.key.toLowerCase(),pd=()=>e.preventDefault();
  if(c&&k==='z'){pd();undo(e.shiftKey?1:-1)}else if(c&&k==='y'){pd();undo(1)}
  else if(c&&k==='s'){pd();saveProject()}else if(c&&k==='d'){pd();dupSel()}else if(c&&k==='c'){copySel()}else if(c&&k==='x'){copySel();delSel()}
  else if(c&&k==='g'){pd();e.shiftKey?ungroupSel():groupSel()}
  else if(c&&k==='a'){pd();sel=objs().filter(o=>!o.lock&&!o.hide).map(o=>o.id);buildInsp();render()}
  else if(k==='delete'||k==='backspace'){pd();delSel()}
  else if(k==='escape'){if(tool==='draw'){setTool('select');if(tab==='dibujo')openTab('dibujo',true)}sel=[];buildInsp();render()}
  else if(k===']'){order(c?'top':'up')}else if(k==='['){order(c?'bottom':'down')}
  else if(k.startsWith('arrow')&&sel.length){pd();const s=e.shiftKey?10:1,dx=k==='arrowleft'?-s:k==='arrowright'?s:0,dy=k==='arrowup'?-s:k==='arrowdown'?s:0;selObjs().forEach(o=>{if(!o.lock){o.x+=dx;o.y+=dy}});render();clearTimeout(nudgeT);nudgeT=setTimeout(commit,400)}
});
addEventListener('paste',e=>{
  if(e.target.matches('input,textarea'))return;
  const fs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));
  if(fs.length){e.preventDefault();addFiles(fs)}else if(clip){e.preventDefault();pasteClip()}
  else{const t=e.clipboardData?.getData('text/plain');if(t?.trim()){e.preventDefault();loadFont('Poppins').then(()=>add({type:'text',text:t.trim().slice(0,2000),font:'Poppins',size:Math.round(doc.w*.05),fill:'#111111',w:doc.w*.8,align:'center',lh:1.2}))}}
});
let dragN=0;
addEventListener('dragenter',e=>{if(e.dataTransfer?.types.some(t=>t==='Files'||t==='text/uri-list')){dragN++;document.body.classList.add('drag')}});
