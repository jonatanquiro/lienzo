<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Lienzo</title>
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lienzo">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0e1014;--panel:#161920;--panel2:#1d212a;--well:#0a0c10;--line:#272c36;--line2:#363d4a;--tx:#eef0f4;--mut:#8d95a5;--ac:#ffb020;--ac2:#ffc657;--actx:#1a1300;--bad:#ff7366;--r:12px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:dark;height:100%}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.ic{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button,.btn{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .12s,border-color .12s}
button:hover,.btn:hover{background:#272c38;border-color:#444c5b}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.primary{background:var(--ac);color:var(--actx);border-color:var(--ac);font-weight:700}
button.primary:hover{background:var(--ac2);border-color:var(--ac2)}
button.sm{padding:5px 8px;min-width:32px;border-radius:8px}
button.on{border-color:var(--ac);color:var(--ac);background:#2c2410}
button.del{color:var(--bad)}
button:disabled{opacity:.38;cursor:default}
button.wide{width:100%}
input[type=number],input[type=text],input[type=search],input[type=password],select,textarea{font:inherit;color:var(--tx);background:var(--well);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;min-width:0}
input[type=range]{accent-color:var(--ac);min-width:0}
input[type=checkbox]{accent-color:var(--ac);width:16px;height:16px}
input[type=color]{width:38px;height:30px;padding:2px;background:var(--well);border:1px solid var(--line2);border-radius:8px;flex:none}
textarea{width:100%;resize:vertical;min-height:60px}
a{color:var(--ac)}

header{flex:none;padding:max(8px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:9px;margin-right:4px}
.brand svg{width:28px;height:28px;border-radius:8px}
.brand b{font-size:17px;letter-spacing:-.2px}
#name{width:150px;background:transparent;border-color:transparent}
#name:hover{border-color:var(--line2)}
.grow{flex:1}
.grp{display:flex;gap:4px;align-items:center}
#zl{min-width:54px}

#app{flex:1;min-height:0;display:grid;grid-template-columns:70px 310px minmax(0,1fr) 290px}
body:not(.left-open) #app{grid-template-columns:70px 0 minmax(0,1fr) 290px}
body:not(.left-open) #left{display:none}
#rail{grid-column:1}#left{grid-column:2}#work{grid-column:3}#insp{grid-column:4}
#rail{display:flex;flex-direction:column;gap:2px;padding:8px 5px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;scrollbar-width:none}
#rail button{flex-direction:column;gap:3px;font-size:10.5px;padding:8px 2px;border:0;background:none;color:var(--mut);flex:none}
#rail button .ic{width:20px;height:20px}
#rail button:hover{color:var(--tx);background:var(--panel2)}
#rail button.on{background:var(--panel2);color:var(--ac)}
#rail .mob{display:none}
#left,#insp{background:var(--panel);overflow:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#left{border-right:1px solid var(--line)}
#insp{border-left:1px solid var(--line)}
h2{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--mut)}
h3{margin:16px 0 8px;font-size:12px;font-weight:700;color:var(--mut)}
.hint{font-size:12.5px;color:var(--mut);margin:8px 0}
#work{display:flex;flex-direction:column;min-width:0;min-height:0}
#scroller{flex:1;min-height:0;overflow:auto;display:flex;padding:28px;background:var(--well)}
#stage{position:relative;margin:auto;flex:none;box-shadow:0 10px 40px rgba(0,0,0,.55);touch-action:none;background:repeating-conic-gradient(#d9d9d9 0 25%,#fff 0 50%) 0 0/20px 20px}
body.draw #stage{cursor:crosshair}
#cv{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;pointer-events:none}
.sb{position:absolute;outline:1.5px solid var(--ac)}
.sb.multi{outline-style:dashed}
.sb.lock{outline-color:#8d95a5}
.hd{position:absolute;width:13px;height:13px;margin:-6.5px;background:#fff;border:1.5px solid var(--ac);border-radius:50%;pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.hd.rot{background:var(--ac);cursor:grab}
.hd.rot::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:16px;background:var(--ac);margin-left:-.75px}
@media (pointer:coarse){.hd{width:20px;height:20px;margin:-10px}}
.gd{position:absolute;background:#ff3d9a}
#marq{position:absolute;border:1px solid var(--ac);background:rgba(255,176,32,.15)}
.ted{position:absolute;margin:0;padding:0;border:0;outline:1.5px dashed var(--ac);background:transparent;resize:none;overflow:hidden;min-height:0;border-radius:0;white-space:pre-wrap;caret-color:var(--ac)}
#pages{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px max(8px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}
#pages .pt{padding:0;border:2px solid var(--line2);border-radius:8px;overflow:hidden;flex:none;position:relative;background:#fff}
#pages .pt.on{border-color:var(--ac)}
#pages .pt canvas{display:block;height:50px;width:auto}
#pages .pt span{position:absolute;left:3px;bottom:2px;font-size:10px;background:rgba(0,0,0,.6);color:#fff;padding:0 4px;border-radius:4px}

details.sec{border-top:1px solid var(--line);padding:10px 0}
details.sec summary{cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
details.sec[open] summary{margin-bottom:10px}
.fr{display:grid;grid-template-columns:84px 1fr 44px;gap:8px;align-items:center;margin:7px 0;font-size:13px;color:var(--mut)}
.fr output{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:7px 0;font-size:13px;color:var(--mut)}
.frow>span:first-child{min-width:76px}
.frow select,.frow input[type=text]{flex:1}
.frow input[type=number]{width:74px}
.frow input[type=range]{flex:1}
.mini{display:inline-flex;gap:5px;align-items:center;font-size:12.5px}
.acts{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.grid{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.grid.g6{grid-template-columns:repeat(6,1fr)}
.th{padding:0;overflow:hidden;border-radius:9px;background:var(--well);aspect-ratio:4/3;position:relative}
.th img,.th canvas{width:100%;height:100%;object-fit:cover;display:block}
.th.fit img,.th.fit canvas{object-fit:contain}
.th.sq{aspect-ratio:1}
.th.icn{aspect-ratio:1;padding:9px;background:var(--panel2)}
.th.icn img{object-fit:contain}
.th small{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;padding:2px 5px;background:rgba(0,0,0,.6);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.sw{aspect-ratio:1;padding:0;border-radius:8px;min-width:0}
.emo{padding:2px;font-size:24px;line-height:1.25;background:none;border-color:transparent}
.flt{padding:0;overflow:hidden;border-radius:8px;aspect-ratio:1;position:relative;background-size:cover;background-position:center}
.flt small{position:absolute;left:0;right:0;bottom:0;font-size:10px;background:rgba(0,0,0,.65);color:#fff;padding:1px 2px}
.search{display:flex;gap:6px;margin:8px 0}
.search input{flex:1}
.lay{display:flex;align-items:center;gap:4px;padding:5px 6px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px;background:var(--panel2);cursor:pointer}
.lay.on{border-color:var(--ac)}
.lay span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.lay button{padding:3px 5px;border:0;background:none;min-width:0}
.lay button .ic{width:15px;height:15px}
.tp{display:block;width:100%;padding:6px;margin-bottom:6px;background:var(--panel2)}
.tp canvas{display:block;width:100%;height:auto}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.chips button{padding:3px 9px;font-size:12px;border-radius:999px}

.modal{position:fixed;inset:0;background:rgba(6,7,9,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:40;display:flex;align-items:center;justify-content:center;padding:12px}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:min(560px,100%);max-height:100%;overflow:auto;padding:16px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.mbox.big{width:auto;max-width:100%}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mhead b{flex:1;font-size:16px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.cwrap{position:relative;overflow:hidden;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;background:#000}
.cwrap img{width:100%;height:100%;display:block;pointer-events:none}
.cbox{position:absolute;outline:2px solid var(--ac);box-shadow:0 0 0 9999px rgba(0,0,0,.62);cursor:move}
.cbox i{position:absolute;width:18px;height:18px;margin:-9px;background:#fff;border:2px solid var(--ac);border-radius:50%}
.cbox i[data-h=nw]{left:0;top:0}.cbox i[data-h=ne]{left:100%;top:0}.cbox i[data-h=sw]{left:0;top:100%}.cbox i[data-h=se]{left:100%;top:100%}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;border:1px solid var(--line2);padding:9px 16px;border-radius:999px;z-index:60;font-size:13.5px;max-width:92vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
body.drag::after{content:"Soltá las imágenes acá";position:fixed;inset:10px;border:3px dashed var(--ac);border-radius:16px;background:rgba(14,16,20,.88);display:grid;place-items:center;font-size:22px;font-weight:600;z-index:50}

@media (max-width:900px){
  .lbl,#name,.brand b,#zOut,#zIn,#bSize span{display:none}
  header{gap:4px;padding-left:8px;padding-right:8px}
  header .grp{gap:3px}
  header button,header button.sm{padding:7px 8px;min-width:0}
  .brand{margin-right:0}
  #app{display:flex;flex-direction:column}
  #work{flex:1;order:1}
  #scroller{padding:14px}
  #rail{order:3;flex:none;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:4px 4px max(4px,env(safe-area-inset-bottom));overflow-x:auto}
  #rail button{min-width:62px}
  #rail .mob{display:inline-flex}
  #left,#insp{display:none;order:2;flex:none;max-height:42vh;border:0;border-top:1px solid var(--line2);border-radius:16px 16px 0 0}
  body.has-sel #rail [data-t=editar]{color:var(--ac)}
  body.left-open #left{display:block}
  body.insp-open #insp{display:block}
  #pages{padding:5px 8px}
  #pages .pt canvas{height:34px}
}
</style>
</head>
<body class="left-open">
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32"><rect width="32" height="32" fill="#1d212a"/><rect x="6" y="8" width="15" height="15" rx="3" fill="#ffb020"/><circle cx="20.5" cy="19.5" r="7" fill="#fff" fill-opacity=".92"/></svg>
    <b>Lienzo</b>
  </div>
  <input id="name" type="text" value="Mi diseño" title="Nombre del diseño" spellcheck="false">
  <div class="grp">
    <button id="bNew" class="sm" title="Diseño nuevo"></button>
    <button id="bOpen" class="sm" title="Abrir proyecto (.lienzo)"></button>
    <button id="bSave" class="sm" title="Guardar proyecto (Ctrl+S)"></button>
  </div>
  <div class="grp">
    <button id="bUndo" class="sm" title="Deshacer (Ctrl+Z)"></button>
    <button id="bRedo" class="sm" title="Rehacer (Ctrl+Y)"></button>
  </div>
  <button id="bSize" title="Tamaño del lienzo"></button>
  <span class="grow"></span>
  <div class="grp">
    <button id="zOut" class="sm" title="Alejar">−</button>
    <button id="zl" class="sm" title="Ajustar a la pantalla">100%</button>
    <button id="zIn" class="sm" title="Acercar">+</button>
  </div>
  <button id="bExp" class="primary"></button>
</header>
<div id="app">
  <nav id="rail"></nav>
  <aside id="left"></aside>
  <section id="work">
    <div id="scroller"><div id="stage"><canvas id="cv"></canvas><div id="ov"></div></div></div>
    <div id="pages"></div>
  </section>
  <aside id="insp"></aside>
</div>
<div id="toast"></div>
<input type="file" id="fImg" accept="image/*" multiple hidden>
<input type="file" id="fRepl" accept="image/*" hidden>
<input type="file" id="fProj" accept=".lienzo,.json,application/json" hidden>

<script>
'use strict';
/* ───────── utilidades ───────── */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const RAD=Math.PI/180,clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=x=>JSON.parse(JSON.stringify(x));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const enc=encodeURIComponent;
function el(tag,props={},...kids){const e=document.createElement(tag);for(const k in props){const v=props[k];if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k in e)e[k]=v;else e.setAttribute(k,v)}e.append(...kids.flat().filter(x=>x!=null&&x!==false));return e}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
const IC={undo:'M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3',redo:'m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3',download:'M12 3v12m-5-5 5 5 5-5M4 21h16',upload:'M12 15V3m-5 5 5-5 5 5M4 21h16',image:'M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6M15.5 9.5h.01',text:'M5 6V4h14v2M12 4v16M9 20h6',shapes:'M4 4h7v7H4zM17 21a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM14 10l3.5-6 3.5 6zM4 14h7v7H4z',layout:'M3 3h18v18H3zM3 9h18M9 9v12',brush:'M18 3l3 3-9.5 9.5-3-3zM7 14c-2 0-3 1.500-3 3.500 0 1.500-1 2.500-2 2.500 4 1 8 0 8-3',layers:'m12 3 9 5-9 5-9-5zM3 13l9 5 9-5M3 17l9 5 9-5',drop:'M12 3s6 6.500 6 11a6 6 0 0 1-12 0c0-4.500 6-11 6-11z',search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5',folder:'M3 6h6l2 2h10v11H3z',save:'M5 3h11l4 4v14H5zM8 3v6h7V3M8 21v-7h8v7',file:'M6 3h8l5 5v13H6zM14 3v5h5M12 12v6M9 15h6',trash:'M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14',copy:'M9 9h11v11H9zM5 15H4V4h11v1',lock:'M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3',unlock:'M6 11h12v9H6zM8 11V8a4 4 0 0 1 7.500-2',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',eyeoff:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM3 3l18 18',up:'m6 15 6-6 6 6',down:'m6 9 6 6 6-6',top:'m6 17 6-6 6 6M6 7h12',bottom:'m6 7 6 6 6-6M6 17h12',plus:'M12 5v14M5 12h14',x:'M6 6l12 12M18 6 6 18',sliders:'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M16 4v4M10 10v4M18 16v4',crop:'M6 2v16h16M2 6h16v16',fliph:'M12 3v18M8 7l-5 5 5 5zM16 7l5 5-5 5z',flipv:'M3 12h18M7 8l5-5 5 5zM7 16l5 5 5-5z',al:'M4 3v18M8 7h10v4H8zM8 14h6v4H8z',ac:'M12 3v18M6 7h12v4H6zM8 14h8v4H8z',ar:'M20 3v18M6 7h10v4H6zM10 14h6v4h-6z',at:'M3 4h18M7 8h4v10H7zM14 8h4v6h-4z',am:'M3 12h18M7 6h4v12H7zM14 8h4v8h-4z',ab:'M3 20h18M7 6h4v10H7zM14 10h4v6h-4z',photo:'M4 7h3l2-3h6l2 3h3v13H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',left:'m15 6-6 6 6 6',right:'m9 6 6 6-6 6',share:'M12 15V3m-4 4 4-4 4 4M5 12v9h14v-9'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const ib=(icon,title,fn,cls='sm')=>el('button',{className:cls,title,innerHTML:ic(icon),onclick:fn});
let toastT;function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms)}
function hexA(h,a){h=(h||'#000000').replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
const blobToURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=src});
function dl(blob,name){const a=el('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const isMob=()=>matchMedia('(max-width:900px)').matches;

/* ───────── estado ───────── */
const newDoc=(w,h)=>({w,h,pages:[{bg:'#ffffff',objs:[]}],uploads:[]});
let doc=newDoc(1080,1080),cur=0,sel=[],zoom=1,tool='select',editing=null,clip=null,tab='plantillas',guides=[],drag=null;
const assets={};
const pg=()=>doc.pages[cur],objs=()=>pg().objs,byId=id=>objs().find(o=>o.id===id),selObjs=()=>sel.map(byId).filter(Boolean);
const cv=$('#cv'),ctx=cv.getContext('2d'),ov=$('#ov'),stage=$('#stage'),scroller=$('#scroller');

function addAsset(src,id=uid()){return loadImg(src).then(img=>{assets[id]={src,img};return id})}
async function fileToSrc(blob){
  let src=await blobToURL(blob);
  if(blob.type==='image/svg+xml')return src;
  const img=await loadImg(src),m=Math.max(img.naturalWidth,img.naturalHeight);
  if(m>3200){const s=3200/m,c=mkCanvas(img.naturalWidth*s,img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);src=c.toDataURL(blob.type==='image/jpeg'?'image/jpeg':'image/png',.92)}
  return src;
}
async function addFiles(files){
  let n=0;
  for(const f of files){
    if(/\.lienzo$|json$/i.test(f.name||'')){openProject(f);return}
    if(!f.type.startsWith('image/'))continue;
    try{const id=await addAsset(await fileToSrc(f));doc.uploads.unshift(id);addImageObj(id);n++}catch(e){toast('No se pudo abrir "'+(f.name||'imagen')+'". Probá con JPG o PNG.')}
  }
  if(n&&tab==='subidas')openTab('subidas',true);
}
function addImageObj(id,extra={}){
  const im=assets[id].img,r=im.naturalWidth/im.naturalHeight||1;let w=doc.w*.6,h=w/r;if(h>doc.h*.6){h=doc.h*.6;w=h*r}
  return add({type:'image',asset:id,x:(doc.w-w)/2,y:(doc.h-h)/2,w,h,...extra});
}
function add(o){
  o={id:uid(),rot:0,op:1,...o};if(o.type==='text')fitText(o);
  if(o.x==null){o.x=(doc.w-o.w)/2;o.y=(doc.h-o.h)/2}
  objs().push(o);sel=[o.id];commit();buildInsp();if(isMob())closeSheets();return o;
}

/* ───────── fuentes ───────── */
const SYS=['Arial','Georgia','Times New Roman','Courier New','Verdana','Impact'];
const FONTS=['Poppins','Montserrat','Inter','Roboto','Open Sans','Lato','Oswald','Raleway','Nunito','Fredoka','Comfortaa','Space Grotesk','Playfair Display','Merriweather','Lora','DM Serif Display','Cinzel','Abril Fatface','Bebas Neue','Anton','Archivo Black','Righteous','Bangers','Pacifico','Lobster','Dancing Script','Great Vibes','Satisfy','Caveat','Shadows Into Light','Amatic SC','Permanent Marker','Special Elite','Press Start 2P',...SYS];
const fontP={};
function loadFont(f){
  if(SYS.includes(f)||!f)return Promise.resolve();
  return fontP[f]??=new Promise(res=>{
    const l=el('link',{rel:'stylesheet',href:`https://fonts.googleapis.com/css?family=${f.replace(/ /g,'+')}:400,700,400italic,700italic&display=swap`});
    l.onload=()=>Promise.all(['400','700','italic 400','italic 700'].map(w=>document.fonts.load(`${w} 20px "${f}"`,'Añá').catch(()=>{}))).then(res);
    l.onerror=res;document.head.append(l);setTimeout(res,7000);
  });
}
async function ensureFonts(pages=doc.pages){
  const txt=pages.flatMap(p=>p.objs).filter(o=>o.type==='text');
  await Promise.all([...new Set(txt.map(o=>o.font))].map(loadFont));
  txt.forEach(fitText);render();
}

/* ───────── dibujo de objetos ───────── */
let S=1; // escala actual del render (para sombras)
function paint(c,p,x,y,w,h){
  if(!p)return'rgba(0,0,0,0)';if(typeof p==='string')return p;
  const a=(p.ang??90)*RAD,dx=Math.sin(a),dy=-Math.cos(a),L=(Math.abs(w*dx)+Math.abs(h*dy))/2,cx=x+w/2,cy=y+h/2;
  const g=c.createLinearGradient(cx-dx*L,cy-dy*L,cx+dx*L,cy+dy*L);g.addColorStop(0,p.a);g.addColorStop(1,p.b);return g;
}
const paintCSS=p=>!p?'transparent':typeof p==='string'?p:`linear-gradient(${p.ang??90}deg,${p.a},${p.b})`;
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r||0,w/2,h/2));c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function shapePath(c,kind,x,y,w,h,r){
  c.beginPath();
  const P=pts=>{pts.forEach(([a,b],i)=>c[i?'lineTo':'moveTo'](x+a*w,y+b*h));c.closePath()};
  const reg=(n,inner)=>{const pts=[],m=inner?n*2:n;for(let i=0;i<m;i++){const a=-Math.PI/2+i*2*Math.PI/m,k=inner&&i%2?inner:.5;pts.push([.5+k*Math.cos(a),.5+k*Math.sin(a)])}P(pts)};
  const B=(...a)=>c.bezierCurveTo(...a.map((v,i)=>i%2?y+v*h:x+v*w));
  switch(kind){
    case'ellipse':c.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);break;
    case'tri':P([[.5,0],[1,1],[0,1]]);break;
    case'rtri':P([[0,0],[1,1],[0,1]]);break;
    case'diamond':P([[.5,0],[1,.5],[.5,1],[0,.5]]);break;
    case'penta':reg(5);break;case'hex':reg(6);break;case'octa':reg(8);break;
    case'star':reg(5,.21);break;case'star8':reg(8,.36);break;case'burst':reg(16,.42);break;
    case'arrowR':P([[0,.3],[.58,.3],[.58,0],[1,.5],[.58,1],[.58,.7],[0,.7]]);break;
    case'chevron':P([[0,0],[.7,0],[1,.5],[.7,1],[0,1],[.3,.5]]);break;
    case'cross':P([[.34,0],[.66,0],[.66,.34],[1,.34],[1,.66],[.66,.66],[.66,1],[.34,1],[.34,.66],[0,.66],[0,.34],[.34,.34]]);break;
    case'para':P([[.22,0],[1,0],[.78,1],[0,1]]);break;
    case'heart':c.moveTo(x+.5*w,y+.28*h);B(.5,.1,.2,-.06,.06,.2);B(-.1,.5,.25,.76,.5,1);B(.75,.76,1.1,.5,.94,.2);B(.8,-.06,.5,.1,.5,.28);c.closePath();break;
    case'blob':c.moveTo(x+.5*w,y);B(.85,-.02,1.05,.3,.95,.55);B(.88,.85,.7,1.02,.45,.98);B(.15,.95,-.05,.75,.03,.45);B(.08,.15,.25,.02,.5,0);c.closePath();break;
    case'bubble':rr(c,x,y,w,h*.8,Math.min(w,h)*.18);c.moveTo(x+w*.2,y+h*.78);c.lineTo(x+w*.16,y+h);c.lineTo(x+w*.42,y+h*.78);c.closePath();break;
    default:rr(c,x,y,w,h,r);
  }
}
function setShadow(c,o){const s=o.sh;if(!s?.on)return;c.shadowColor=hexA(s.c,s.a??.45);c.shadowBlur=(s.b??24)*S;c.shadowOffsetX=(s.x??0)*S;c.shadowOffsetY=(s.y??12)*S}
const noShadow=c=>{c.shadowColor='rgba(0,0,0,0)';c.shadowBlur=0;c.shadowOffsetX=c.shadowOffsetY=0};

const mctx=mkCanvas(1,1).getContext('2d');
const fontStr=o=>`${o.ital?'italic ':''}${o.bold?700:400} ${o.size}px "${o.font}", sans-serif`;
function layout(o,c=mctx){
  c.font=fontStr(o);if('letterSpacing'in c)c.letterSpacing=(o.ls||0)+'px';
  const txt=o.upper?o.text.toUpperCase():o.text;
  if(o.curve)return[txt.replace(/\n/g,' ')];
  const out=[];
  for(const para of txt.split('\n')){let line='';for(const word of para.split(' ')){const t=line?line+' '+word:word;if(line&&c.measureText(t).width>o.w){out.push(line);line=word}else line=t}out.push(line)}
  return out;
}
function fitText(o){
  const L=layout(o),lh=o.size*(o.lh||1.2);
  if(o.curve){const R=mctx.measureText(L[0]).width/(Math.abs(o.curve)*RAD);o.h=lh+R*(1-Math.cos(Math.min(Math.abs(o.curve),360)*RAD/2))}
  else o.h=Math.max(lh,L.length*lh);
}
function drawText(c,o){
  const L=layout(o,c),w=o.w,h=o.h,lh=o.size*(o.lh||1.2);
  if(o.bgc){const p=o.size*.28;c.beginPath();rr(c,-w/2-p,-h/2-p*.5,w+p*2,h+p,o.size*.22);c.fillStyle=o.bgc;c.fill()}
  c.textBaseline='middle';c.lineJoin='round';c.fillStyle=paint(c,o.fill,-w/2,-h/2,w,h);c.strokeStyle=o.sc||'#000000';c.lineWidth=(o.sw||0)*2;
  const pass=fn=>{setShadow(c,o);if(o.sw>0){fn(true);noShadow(c)}fn(false);noShadow(c)};
  if(o.curve){
    const s=L[0],tw=c.measureText(s).width,R=tw/(o.curve*RAD),cy=o.curve>0?-h/2+lh/2+R:h/2-lh/2+R;c.textAlign='center';
    pass(st=>{let pos=0;for(const ch of[...s]){const cw=c.measureText(ch).width;c.save();c.translate(0,cy);c.rotate((pos+cw/2-tw/2)/R);c.translate(0,-R);st?c.strokeText(ch,0,0):c.fillText(ch,0,0);c.restore();pos+=cw}});
    return;
  }
  c.textAlign='left';
  pass(st=>L.forEach((ln,i)=>{
    const tw=c.measureText(ln).width,x=o.align==='left'?-w/2:o.align==='right'?w/2-tw:-tw/2,y=-h/2+lh*(i+.5);
    if(st)c.strokeText(ln,x,y);else{c.fillText(ln,x,y);if(o.under)c.fillRect(x,y+o.size*.44,tw,Math.max(1,o.size*.06))}
  }));
}
const HASF=typeof mctx.filter==='string';
function filterStr(f,k=1){
  if(!f)return'';const p=[];
  if((f.br??1)!==1)p.push(`brightness(${f.br})`);if((f.ct??1)!==1)p.push(`contrast(${f.ct})`);if((f.sat??1)!==1)p.push(`saturate(${f.sat})`);
  if(f.hue)p.push(`hue-rotate(${f.hue}deg)`);if(f.gray)p.push(`grayscale(${f.gray})`);if(f.sepia)p.push(`sepia(${f.sepia})`);if(f.inv)p.push(`invert(${f.inv})`);
  if(f.blur)p.push(`blur(${f.blur*k}px)`);return p.join(' ');
}
function pixelFilter(x,w,h,f){ // para navegadores sin filtros de canvas (Safari)
  const d=x.getImageData(0,0,w,h),p=d.data,br=f.br??1,ct=f.ct??1,sat=f.sat??1,g=f.gray||0,sp=f.sepia||0,iv=f.inv||0;
  for(let i=0;i<p.length;i+=4){
    let r=p[i]*br,gg=p[i+1]*br,b=p[i+2]*br;
    r=(r-128)*ct+128;gg=(gg-128)*ct+128;b=(b-128)*ct+128;
    const l=.299*r+.587*gg+.114*b,s2=sat*(1-g);r=l+(r-l)*s2;gg=l+(gg-l)*s2;b=l+(b-l)*s2;
    if(sp){const sr=.393*r+.769*gg+.189*b,sg=.349*r+.686*gg+.168*b,sb=.272*r+.534*gg+.131*b;r+=(sr-r)*sp;gg+=(sg-gg)*sp;b+=(sb-b)*sp}
    if(iv){r+=(255-2*r)*iv;gg+=(255-2*gg)*iv;b+=(255-2*b)*iv}
    p[i]=r;p[i+1]=gg;p[i+2]=b;
  }
  x.putImageData(d,0,0);
}
const pc={};
function proc(o){
  const a=assets[o.asset];if(!a)return null;
  const im=a.img,iw=im.naturalWidth,ih=im.naturalHeight,c=o.crop||{x:0,y:0,w:1,h:1};
  const r={im,sx:c.x*iw,sy:c.y*ih,sw:c.w*iw,sh:c.h*ih},f=o.f,fx=o.fx||{};
  const fs=filterStr(f),hasFx=fx.vig||fx.pix||fx.grain||fx.tintA;
  if(!fs&&!hasFx)return r;
  const key=o.asset+JSON.stringify([c,f,fx]);if(pc[o.id]?.key===key)return pc[o.id].r;
  const s=Math.min(1,2000/Math.max(r.sw,r.sh)),cw=Math.max(1,Math.round(r.sw*s)),ch=Math.max(1,Math.round(r.sh*s));
  const cn=mkCanvas(cw,ch),x=cn.getContext('2d'),base=()=>x.drawImage(im,r.sx,r.sy,r.sw,r.sh,0,0,cw,ch);
  if(fs&&HASF)x.filter=filterStr(f,cw/1000);
  base();if(HASF)x.filter='none';
  if(fs&&!HASF)pixelFilter(x,cw,ch,f);
  if(hasFx){
    if(fx.pix){const bs=Math.max(2,fx.pix*cw/1000),t=mkCanvas(cw/bs,ch/bs);t.getContext('2d').drawImage(cn,0,0,t.width,t.height);x.clearRect(0,0,cw,ch);x.imageSmoothingEnabled=false;x.drawImage(t,0,0,cw,ch);x.imageSmoothingEnabled=true}
    if(fx.tintA){x.globalCompositeOperation='color';x.globalAlpha=fx.tintA;x.fillStyle=fx.tint||'#ffb020';x.fillRect(0,0,cw,ch);x.globalAlpha=1;x.globalCompositeOperation='source-over'}
    if(fx.vig){const g=x.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*.25,cw/2,ch/2,Math.hypot(cw,ch)/2);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${fx.vig})`);x.fillStyle=g;x.fillRect(0,0,cw,ch)}
    if(fx.grain){const d=x.getImageData(0,0,cw,ch),p=d.data,k=fx.grain*110;for(let i=0;i<p.length;i+=4){const n=(Math.random()-.5)*k;p[i]+=n;p[i+1]+=n;p[i+2]+=n}x.putImageData(d,0,0)}
    x.globalCompositeOperation='destination-in';base();x.globalCompositeOperation='source-over';
  }
  const out={im:cn,sx:0,sy:0,sw:cw,sh:ch};pc[o.id]={key,r:out};return out;
}
let scr=null;
function drawImageObj(c,o){
  const p=proc(o),w=o.w,h=o.h,x=-w/2,y=-h/2;
  if(!p){c.fillStyle='#8886';c.fillRect(x,y,w,h);return}
  if(o.mask||o.rad||o.bw){
    const k=Math.min(S,4096/Math.max(w,h));scr=scr||mkCanvas(1,1);scr.width=Math.max(1,Math.ceil(w*k));scr.height=Math.max(1,Math.ceil(h*k));
    const t=scr.getContext('2d');t.scale(k,k);shapePath(t,o.mask||'rect',0,0,w,h,o.rad);t.save();t.clip();t.drawImage(p.im,p.sx,p.sy,p.sw,p.sh,0,0,w,h);
    if(o.bw){t.strokeStyle=o.bc||'#ffffff';t.lineWidth=o.bw*2;t.stroke()}t.restore();
    setShadow(c,o);c.drawImage(scr,x,y,w,h);
  }else{setShadow(c,o);c.drawImage(p.im,p.sx,p.sy,p.sw,p.sh,x,y,w,h)}
}
function strokePts(c,pts,x,y,w,h){
  c.beginPath();const P=i=>[x+pts[i][0]*w,y+pts[i][1]*h];c.moveTo(...P(0));
  if(pts.length<3){c.lineTo(...P(pts.length-1));c.lineTo(P(0)[0]+.01,P(0)[1])}
  else{for(let i=1;i<pts.length-1;i++){const a=P(i),b=P(i+1);c.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}c.lineTo(...P(pts.length-1))}
  c.stroke();
}
function drawObj(c,o){
  c.save();c.translate(o.x+o.w/2,o.y+o.h/2);c.rotate((o.rot||0)*RAD);c.scale(o.flipX?-1:1,o.flipY?-1:1);
  c.globalAlpha=o.op??1;c.globalCompositeOperation=o.blend||'source-over';
  const w=o.w,h=o.h,x=-w/2,y=-h/2;
  if(o.type==='image')drawImageObj(c,o);
  else if(o.type==='text')drawText(c,o);
  else if(o.type==='path'){c.strokeStyle=o.fill;c.lineWidth=o.sw;c.lineCap=c.lineJoin='round';setShadow(c,o);strokePts(c,o.pts,x,y,w,h)}
  else if(o.kind==='line'||o.kind==='arrow'){
    const sw=o.sw||8,ar=o.kind==='arrow';c.strokeStyle=c.fillStyle=paint(c,o.fill,x,y,w,h);c.lineWidth=sw;c.lineCap=ar?'butt':'round';if(o.dash)c.setLineDash([sw*2.5,sw*1.8]);
    setShadow(c,o);c.beginPath();c.moveTo(x+(ar?0:sw/2),0);c.lineTo(x+w-(ar?sw*3:sw/2),0);c.stroke();
    if(ar){c.setLineDash([]);c.beginPath();c.moveTo(x+w,0);c.lineTo(x+w-sw*4,-sw*2.2);c.lineTo(x+w-sw*4,sw*2.2);c.closePath();c.fill()}
  }else{
    shapePath(c,o.kind,x,y,w,h,o.rad);setShadow(c,o);
    if(o.fill){c.fillStyle=paint(c,o.fill,x,y,w,h);c.fill();noShadow(c)}
    if(o.sw>0){c.strokeStyle=o.sc||'#000000';c.lineWidth=o.sw;if(o.dash)c.setLineDash([o.sw*2.5,o.sw*1.8]);c.stroke()}
  }
  c.restore();
}
function drawPage(c,p,scale,w=doc.w,h=doc.h,transparent=false){
  S=scale;c.save();c.scale(scale,scale);
  if(!transparent&&p.bg){c.fillStyle=paint(c,p.bg,0,0,w,h);c.fillRect(0,0,w,h)}
  c.beginPath();c.rect(0,0,w,h);c.clip();
  for(const o of p.objs)if(!o.hide&&o.id!==editing)drawObj(c,o);
  c.restore();
}

/* ───────── vista principal ───────── */
let raf=0;
function render(){
  if(raf)return;
  raf=requestAnimationFrame(()=>{
    raf=0;
    stage.style.width=doc.w*zoom+'px';stage.style.height=doc.h*zoom+'px';
    let sc=zoom*Math.min(devicePixelRatio||1,2);sc=Math.min(sc,4096/Math.max(doc.w,doc.h));
    const W=Math.round(doc.w*sc),H=Math.round(doc.h*sc);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);drawPage(ctx,pg(),W/doc.w);
    if(drag?.mode==='draw'){ctx.save();ctx.scale(W/doc.w,W/doc.w);ctx.strokeStyle=brush.color;ctx.lineWidth=brush.size;ctx.lineCap=ctx.lineJoin='round';strokePts(ctx,drag.pts,0,0,1,1);ctx.restore()}
    overlay();
  });
}
function aabb(o){
  const a=(o.rot||0)*RAD,c=Math.abs(Math.cos(a)),s=Math.abs(Math.sin(a)),w=o.w*c+o.h*s,h=o.w*s+o.h*c;
  return{x:o.x+o.w/2-w/2,y:o.y+o.h/2-h/2,w,h};
}
function bbox(L){let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;for(const o of L){const a=aabb(o);x1=Math.min(x1,a.x);y1=Math.min(y1,a.y);x2=Math.max(x2,a.x+a.w);y2=Math.max(y2,a.y+a.h)}return{x:x1,y:y1,w:x2-x1,h:y2-y1}}
const isLine=o=>o.type==='shape'&&(o.kind==='line'||o.kind==='arrow');
function overlay(){
  ov.innerHTML='';const L=selObjs(),z=zoom;
  for(const o of L){
    const b=el('div',{className:'sb'+(L.length>1?' multi':'')+(o.lock?' lock':''),style:`left:${o.x*z}px;top:${o.y*z}px;width:${o.w*z}px;height:${o.h*z}px;transform:rotate(${o.rot||0}deg)`});
    if(L.length===1&&!o.lock&&!editing&&tool==='select'){
      const hs=o.type==='image'?['nw','ne','se','sw']:o.type==='text'?['nw','ne','se','sw','e','w']:isLine(o)?['e','w']:['nw','n','ne','e','se','s','sw','w'];
      for(const h of hs)b.append(el('i',{className:'hd','data-h':h,style:`left:${h.includes('w')?0:h.includes('e')?100:50}%;top:${h.includes('n')?0:h.includes('s')?100:50}%;cursor:${h==='n'||h==='s'?'ns':h==='e'||h==='w'?'ew':h==='nw'||h==='se'?'nwse':'nesw'}-resize`}));
      b.append(el('i',{className:'hd rot','data-h':'rot',style:'left:50%;top:-28px',title:'Girar'}));
    }
    ov.append(b);
  }
  for(const g of guides)ov.append(el('div',{className:'gd',style:g.x!=null?`left:${g.x*z}px;top:0;width:1px;height:100%`:`top:${g.y*z}px;left:0;height:1px;width:100%`}));
  if(drag?.mode==='marq'&&drag.r){const r=drag.r;ov.append(el('div',{id:'marq',style:`left:${r.x*z}px;top:${r.y*z}px;width:${r.w*z}px;height:${r.h*z}px`}))}
  if(editing)posEdit();
}
function setZoom(z,keep){zoom=clamp(z,.03,8);$('#zl').textContent=Math.round(zoom*100)+'%';render()}
function fitZoom(){const pad=isMob()?28:70;setZoom(Math.min((scroller.clientWidth-pad)/doc.w,(scroller.clientHeight-pad)/doc.h,2))}

/* ───────── historial y guardado ───────── */
let hist=[],hi=-1,saveT,thumbT;
function commit(){hist.length=hi+1;hist.push(JSON.stringify({doc,cur}));if(hist.length>80)hist.shift();hi=hist.length-1;after()}
function after(){
  render();clearTimeout(thumbT);thumbT=setTimeout(buildPages,200);clearTimeout(saveT);saveT=setTimeout(autosave,1200);
  if(tab==='capas')buildLayers();
  $('#bUndo').disabled=hi<=0;$('#bRedo').disabled=hi>=hist.length-1;
  $('#bSize').innerHTML=ic('layout')+`<span>${doc.w} × ${doc.h}</span>`;
}
function undo(d){
  if(!hist[hi+d])return;endEdit();hi+=d;const w=doc.w,h=doc.h;({doc,cur}=JSON.parse(hist[hi]));cur=clamp(cur,0,doc.pages.length-1);sel=sel.filter(byId);
  if(w!==doc.w||h!==doc.h)fitZoom();after();buildInsp();
}
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('lienzo',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function kv(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv',v===undefined?'readonly':'readwrite'),s=t.objectStore('kv');const q=v===undefined?s.get(k):s.put(v,k);t.oncomplete=()=>res(q.result);t.onerror=()=>rej(t.error)})}
function payload(){
  const used=new Set(doc.uploads);doc.pages.forEach(p=>p.objs.forEach(o=>o.asset&&used.add(o.asset)));
  const a={};for(const id of used)if(assets[id])a[id]=assets[id].src;
  doc.name=$('#name').value;return{app:'lienzo',v:1,doc,assets:a};
}
function autosave(){kv('auto',payload()).catch(()=>{})}
async function loadPayload(p){
  if(!p?.doc?.pages)throw new Error('formato');
  await Promise.all(Object.entries(p.assets||{}).map(([id,src])=>addAsset(src,id).catch(()=>{})));
  doc=p.doc;doc.uploads||=[];cur=0;sel=[];hist=[];hi=-1;$('#name').value=doc.name||'Mi diseño';
  fitZoom();commit();buildInsp();if(document.body.classList.contains('left-open'))openTab(tab,true);ensureFonts();
}
async function openProject(f){try{await loadPayload(JSON.parse(await f.text()));toast('Proyecto abierto')}catch(e){toast('Ese archivo no es un proyecto de Lienzo.')}}
function saveProject(){dl(new Blob([JSON.stringify(payload())],{type:'application/json'}),($('#name').value||'diseño')+'.lienzo');toast('Proyecto guardado en Descargas')}

    if(!d)return;const fx=(e.clientX-d.px)/d.r.width,fy=(e.clientY-d.py)/d.r.height,c0=d.c;
    if(!d.h){c.x=clamp(c0.x+fx,0,1-c0.w);c.y=clamp(c0.y+fy,0,1-c0.h)}
    else{
      const dx=d.h.includes('e')?1:-1,dy=d.h.includes('s')?1:-1,ax=dx>0?c0.x:c0.x+c0.w,ay=dy>0?c0.y:c0.y+c0.h;
      const px=clamp((e.clientX-d.r.left)/d.r.width,0,1),py=clamp((e.clientY-d.r.top)/d.r.height,0,1);
      let w=Math.max(.04,(px-ax)*dx),h=Math.max(.04,(py-ay)*dy);
      if(ratio){const r=ratio*ih/iw,av=dy>0?1-ay:ay;h=w/r;if(h>av){h=av;w=h*r}}
      c={x:dx>0?ax:ax-w,y:dy>0?ay:ay-h,w,h};
    }
    upd();
  };
  wrap.onpointerup=wrap.onpointercancel=()=>d=null;
  modal('Recortar imagen',el('div',{},wrap,el('label',{className:'frow',style:'margin-top:12px'},el('span',{textContent:'Proporción'}),rs)),close=>[el('button',{textContent:'Quitar recorte',onclick(){c={x:0,y:0,w:1,h:1};upd()}}),el('button',{className:'primary',textContent:'Aplicar',onclick(){
    const full=c.w>.999&&c.h>.999;o.crop=full?undefined:c;const r=(c.w*iw)/(c.h*ih),cy=o.y+o.h/2;o.h=o.w/r;o.y=cy-o.h/2;close();commit();buildInsp()}})],'big');
}

/* ───────── eventos generales ───────── */
$('#bNew').innerHTML=ic('file');$('#bOpen').innerHTML=ic('folder');$('#bSave').innerHTML=ic('save');$('#bUndo').innerHTML=ic('undo');$('#bRedo').innerHTML=ic('redo');$('#bExp').innerHTML=ic('download')+'<span class="lbl">Descargar</span>';
$('#rail').append(el('button',{className:'mob','data-t':'editar',innerHTML:ic('sliders')+'<span>Editar</span>',onclick:()=>openTab('editar')}),...TABS.map(([t,i,n])=>el('button',{'data-t':t,innerHTML:ic(i)+`<span>${n}</span>`,onclick:()=>openTab(t)})));
$('#bNew').onclick=()=>modal('Diseño nuevo',el('p',{textContent:'Se va a borrar el diseño actual. Si lo querés conservar, guardá el proyecto antes.'}),close=>[el('button',{textContent:'Cancelar',onclick:close}),el('button',{textContent:'Guardar proyecto',onclick:saveProject}),el('button',{className:'primary',textContent:'Empezar de cero',onclick(){close();doc=newDoc(doc.w,doc.h);cur=0;sel=[];$('#name').value='Mi diseño';commit();buildInsp();openTab('plantillas',true)}})]);
$('#bOpen').onclick=()=>$('#fProj').click();$('#bSave').onclick=saveProject;$('#bUndo').onclick=()=>undo(-1);$('#bRedo').onclick=()=>undo(1);$('#bSize').onclick=sizeModal;$('#bExp').onclick=exportModal;
$('#zOut').onclick=()=>setZoom(zoom/1.2);$('#zIn').onclick=()=>setZoom(zoom*1.2);$('#zl').onclick=fitZoom;
$('#fImg').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
$('#fProj').onchange=e=>{if(e.target.files[0])openProject(e.target.files[0]);e.target.value=''};
$('#fRepl').onchange=async e=>{const f=e.target.files[0],o=selObjs()[0];e.target.value='';if(!f||!o||o.type!=='image')return;try{const id=await addAsset(await fileToSrc(f)),im=assets[id].img;doc.uploads.unshift(id);o.asset=id;const ir=im.naturalWidth/im.naturalHeight,fr=o.w/o.h;o.crop=Math.abs(ir-fr)<.01?undefined:ir>fr?{x:(1-fr/ir)/2,y:0,w:fr/ir,h:1}:{x:0,y:(1-ir/fr)/2,w:1,h:ir/fr};commit();buildInsp()}catch(_){toast('No se pudo abrir esa imagen.')}};
$('#name').onchange=()=>{clearTimeout(saveT);saveT=setTimeout(autosave,300)};
let nudgeT;
addEventListener('keydown',e=>{
  if(e.target.matches('input:not([type=range]):not([type=checkbox]):not([type=color]),textarea,select'))return;
  const m=$('.modal');if(m){if(e.key==='Escape')m.remove();return}
  const c=e.ctrlKey||e.metaKey,k=e.key.toLowerCase(),pd=()=>e.preventDefault();
  if(c&&k==='z'){pd();undo(e.shiftKey?1:-1)}else if(c&&k==='y'){pd();undo(1)}
  else if(c&&k==='s'){pd();saveProject()}else if(c&&k==='d'){pd();dupSel()}else if(c&&k==='c'){copySel()}else if(c&&k==='x'){copySel();delSel()}
  else if(c&&k==='a'){pd();sel=objs().filter(o=>!o.lock&&!o.hide).map(o=>o.id);buildInsp();render()}
  else if(k==='delete'||k==='backspace'){pd();delSel()}
  else if(k==='escape'){if(tool==='draw'){setTool('select');if(tab==='dibujo')openTab('dibujo',true)}sel=[];buildInsp();render()}
  else if(k===']'){order(c?'top':'up')}else if(k==='['){order(c?'bottom':'down')}
  else if(k.startsWith('arrow')&&sel.length){pd();const s=e.shiftKey?10:1,dx=k==='arrowleft'?-s:k==='arrowright'?s:0,dy=k==='arrowup'?-s:k==='arrowdown'?s:0;selObjs().forEach(o=>{if(!o.lock){o.x+=dx;o.y+=dy}});render();clearTimeout(nudgeT);nudgeT=setTimeout(commit,400)}
});
addEventListener('paste',e=>{
  if(e.target.matches('input,textarea'))return;
  const fs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));
  if(fs.length){e.preventDefault();addFiles(fs)}else if(clip){e.preventDefault();pasteClip()}
  else{const t=e.clipboardData?.getData('text/plain');if(t?.trim()){e.preventDefault();loadFont('Poppins').then(()=>add({type:'text',text:t.trim().slice(0,2000),font:'Poppins',size:Math.round(doc.w*.05),fill:'#111111',w:doc.w*.8,align:'center',lh:1.2}))}}
});
let dragN=0;
addEventListener('dragenter',e=>{if(e.dataTransfer?.types.includes('Files')){dragN++;document.body.classList.add('drag')}});
addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;document.body.classList.remove('drag')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragN=0;document.body.classList.remove('drag');if(e.dataTransfer?.files.length)addFiles([...e.dataTransfer.files])});
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(fitZoom,150)});

/* ───────── arranque ───────── */
(async()=>{
  if(isMob())document.body.classList.remove('left-open');
  fitZoom();commit();buildInsp();
  if(!isMob())openTab('plantillas',true);
  try{const p=await kv('auto');if(p?.doc?.pages?.some(x=>x.objs.length))await loadPayload(p)}catch(e){}
  if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
